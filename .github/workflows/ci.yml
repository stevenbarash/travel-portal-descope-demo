name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Typecheck, lint, brand guard, unit tests. No Descope project needed; the Playwright suite
    # (npm run check:full) runs locally against the project in .env.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # package.json needs npm 12+ (allowScripts, min-release-age).
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run check
